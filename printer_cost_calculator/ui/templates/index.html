<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Калькулятор цены 3D-печати</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; }
    .tab { display: block; padding: 12px 16px; margin: 8px 0;
           border: 1px solid #ccc; border-radius: 8px; text-decoration: none; color: #222; }
    .tab:hover { background: #f2f6ff; }
    .todo { color: #888; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Калькулятор цены 3D-печати</h1>
  <p class="todo">Каркас интерфейса. Вкладки будут реализованы на следующем этапе:</p>
  {% for url, label in tabs %}
    <a class="tab" href="/{{ url }}">{{ label }}</a>
  {% endfor %}
</body>
</html>
